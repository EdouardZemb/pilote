name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  socle:
    uses: ./.github/workflows/modele-socle.yml
    secrets: inherit

# Les vérifications propres au projet (tests, lint, construction) s'ajoutent ici, dans un job `verifier`.
# Ce fichier est au projet : `copier update` n'y touche plus.

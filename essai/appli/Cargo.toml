[package]
name = "appli-essai"
version = "0.1.0"
edition = "2024"
publish = false

# Sous Linux, l'application se construit en un `main` qui sort en 64 : wry, tao et windows ne
# s'y construisent pas.
[target.'cfg(windows)'.dependencies]
wry = "=0.57.1"
tao = "=0.37.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
